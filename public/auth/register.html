<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisztráció</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #141414; 
            color: white; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background-color: #222;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 420px;
        }
        .register-card .btn-danger {
            background-color: #e50914;
            border: none;
            font-weight: 600;
        }
        .register-card .form-control {
            background-color: #333;
            border: none;
            color: white;
        }
        .register-card .form-control:focus {
            background-color: #444;
            box-shadow: 0 0 0 0.2rem rgba(229, 9, 20, 0.3);
        }
        .register-card label {
            font-weight: 500;
        }
        .text-link {
            color: #e50914;
            text-decoration: none;
        }
        .text-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-card mx-auto">
            <h2 class="text-center mb-4">Regisztráció</h2>
            <form action="/register" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Felhasználónév</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Jelszó</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-danger w-100">Regisztráció</button>
            </form>
            <p class="text-center mt-4 mb-0">
                Van fiókod? <a href="/auth/login.html" class="text-link">Bejelentkezés</a>
            </p>
        </div>
    </div>
</body>
</html>
